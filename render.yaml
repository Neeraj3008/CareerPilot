services:
  # -------------------------------------------------------------
  # Backend FastAPI Web Service
  # -------------------------------------------------------------
  - type: web
    name: careerpilot-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CORS_ORIGINS
        sync: false

  # -------------------------------------------------------------
  # Frontend React Static Site
  # -------------------------------------------------------------
  - type: web
    name: careerpilot-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: careerpilot-backend
          property: host

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL with pgvector support
  # -------------------------------------------------------------
  - name: careerpilot-postgres
    plan: free
    region: oregon
    databaseName: careerpilot
    user: careerpilot_user
